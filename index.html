<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FúriaJapa | Missões Matemáticas</title>
<style>
:root{--bg:#091426;--panel:#102341;--panel2:#162d52;--cyan:#27e6ff;--blue:#3877ff;--purple:#9a4dff;--pink:#ff4fd8;--yellow:#ffe45e;--green:#42f59e;--red:#ff5576;--text:#f4fbff;--muted:#a9bdd8}
*{box-sizing:border-box} body{margin:0;color:var(--text);font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 20% 5%,#213e79 0,transparent 27%),radial-gradient(circle at 90% 15%,#5a2389 0,transparent 28%),linear-gradient(145deg,#07101e,#0e1930 55%,#15152f);min-height:100vh}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background-image:linear-gradient(30deg,#fff 1px,transparent 1px),linear-gradient(150deg,#fff 1px,transparent 1px);background-size:42px 72px}
button,input{font:inherit}.app{max-width:1280px;margin:auto;padding:20px}.topbar{display:flex;gap:18px;justify-content:space-between;align-items:center;background:rgba(8,18,35,.88);border:1px solid #3d6ba0;border-radius:24px;padding:18px 22px;box-shadow:0 16px 50px #0008;backdrop-filter:blur(10px)}
.brand{display:flex;align-items:center;gap:15px}.avatar{width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:38px;background:linear-gradient(145deg,var(--purple),var(--cyan));border:3px solid #fff;box-shadow:0 0 25px #27e6ff88}.brand h1{margin:0;text-transform:uppercase;font-size:clamp(22px,4vw,44px);line-height:.95;letter-spacing:-1px}.brand h1 span{color:var(--yellow)}.brand p{margin:8px 0 0;color:var(--muted)}
.player{min-width:280px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#142949;border-radius:14px;padding:9px;text-align:center;border:1px solid #2d527d}.stat b{display:block;color:var(--yellow);font-size:20px}.bar{height:13px;background:#07111f;border-radius:99px;overflow:hidden;border:1px solid #416388;margin-top:10px}.bar>div{height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));width:0;transition:.4s}.layout{display:grid;grid-template-columns:340px 1fr;gap:18px;margin-top:18px}.side,.content{background:rgba(12,28,53,.9);border:1px solid #365e8d;border-radius:24px;box-shadow:0 14px 40px #0006}.side{padding:16px;max-height:calc(100vh - 150px);overflow:auto}.side h2{font-size:16px;text-transform:uppercase;color:var(--cyan);letter-spacing:2px;margin:5px 4px 13px}.mission-btn{width:100%;display:grid;grid-template-columns:42px 1fr 24px;gap:10px;align-items:center;text-align:left;color:#fff;background:#142b4f;border:1px solid #31567e;border-radius:15px;padding:10px;margin:8px 0;cursor:pointer;transition:.2s}.mission-btn:hover,.mission-btn.active{transform:translateX(4px);border-color:var(--cyan);box-shadow:0 0 16px #27e6ff33}.mission-btn.locked{opacity:.45;filter:grayscale(.8)}.mission-btn .n{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(145deg,var(--blue),var(--purple));font-weight:900}.mission-btn small{display:block;color:var(--muted);margin-top:3px}.mission-btn.done .n{background:linear-gradient(145deg,#14794f,var(--green));color:#042216}.content{padding:26px;min-height:650px}.tag{display:inline-block;padding:6px 10px;border-radius:99px;background:#53329b;color:#fff;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:1px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:start}.hero h2{font-size:clamp(26px,4vw,48px);margin:10px 0 8px;line-height:1}.hero p{color:var(--muted);font-size:17px}.timerbox{min-width:160px;text-align:center;background:#071426;border:2px solid var(--cyan);border-radius:20px;padding:15px;box-shadow:inset 0 0 22px #27e6ff22}.timerbox label{font-size:12px;color:var(--cyan);font-weight:900;letter-spacing:2px}.timer{font-size:35px;font-weight:900;margin:5px}.timer-controls{display:flex;gap:6px}.timer-controls button{flex:1;border:0;border-radius:9px;padding:7px;cursor:pointer;background:#284d79;color:#fff}.briefing{margin:20px 0;padding:17px;border-left:5px solid var(--yellow);background:#1d3152;border-radius:5px 16px 16px 5px}.briefing b{color:var(--yellow)}.learn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:16px 0}.card{background:#102443;border:1px solid #31577f;border-radius:17px;padding:16px}.card h3{margin:0 0 10px;color:var(--cyan)}.formula{background:#08162a;border:1px dashed var(--cyan);border-radius:12px;padding:14px;font:700 18px Consolas,monospace;color:var(--yellow);text-align:center}.question{margin-top:18px;background:linear-gradient(145deg,#172c50,#1b2450);border:1px solid #6353a0;border-radius:20px;padding:20px}.question h3{margin-top:0}.options{display:grid;grid-template-columns:1fr 1fr;gap:10px}.opt{border:1px solid #44658c;background:#122541;color:#fff;border-radius:13px;padding:13px;text-align:left;cursor:pointer}.opt:hover{border-color:var(--cyan)}.opt.selected{background:#254b78;border-color:var(--cyan)}.opt.correct{background:#126443;border-color:var(--green)}.opt.wrong{background:#702b43;border-color:var(--red)}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:15px}.primary,.secondary{border:0;border-radius:12px;padding:12px 18px;font-weight:900;cursor:pointer;text-transform:uppercase}.primary{background:linear-gradient(90deg,var(--yellow),#ff9c38);color:#1b1b16}.secondary{background:#294c77;color:#fff}.feedback{min-height:28px;margin-top:12px;font-weight:700}.good{color:var(--green)}.bad{color:#ff8399}.reward{margin-top:17px;display:flex;gap:10px;align-items:center;color:var(--muted)}.reward span{color:var(--yellow);font-weight:900}.victory{text-align:center;padding:45px 20px}.victory .cup{font-size:90px}.victory h2{font-size:48px;color:var(--yellow)}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{max-height:330px}.topbar{align-items:flex-start;flex-direction:column}.player{width:100%}.hero{flex-direction:column}.timerbox{width:100%}.learn,.options{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<header class="topbar">
  <div class="brand"><div class="avatar">🥷</div><div><h1>Operação <span>FúriaJapa</span></h1><p>18 missões matemáticas • 9º ano • 4º bimestre</p></div></div>
  <div class="player"><div class="stats"><div class="stat"><b id="xp">0</b>XP</div><div class="stat"><b id="level">1</b>Nível</div><div class="stat"><b id="done">0/18</b>Missões</div></div><div class="bar"><div id="progress"></div></div></div>
</header>
<div class="layout">
<aside class="side"><h2>Mapa de missões</h2><div id="missionList"></div><button class="secondary" onclick="resetGame()" style="width:100%;margin-top:12px">Reiniciar progresso</button></aside>
<main class="content" id="content"></main>
</div>
</div>
<script>
const missions=[
{t:'Diferenciando área e perímetro',c:'Área e perímetro',h:'EF08MA19',ae:'AE9',learn:'Área mede a superfície ocupada. Perímetro é a soma dos comprimentos dos lados.',f:'Retângulo: A = b × h | P = 2(b + h)',q:'Uma arena retangular mede 8 m por 5 m. Qual é a área?',o:['13 m²','26 m²','40 m²','80 m²'],a:2,e:'8 × 5 = 40 m².'},
{t:'Área de triângulos e quadriláteros',c:'Cálculo de áreas',h:'EF08MA19',ae:'AE9',learn:'No triângulo, multiplicamos base e altura e dividimos por 2. Em um paralelogramo, usamos base vezes altura.',f:'Triângulo: A = (b × h) ÷ 2',q:'Uma bandeira triangular tem base 10 m e altura 6 m. Qual é a área?',o:['16 m²','30 m²','60 m²','120 m²'],a:1,e:'(10 × 6) ÷ 2 = 30 m².'},
{t:'Figuras por decomposição',c:'Decomposição em formas simples',h:'EF08MA19',ae:'AE9',learn:'Uma forma complexa pode ser dividida em retângulos, triângulos e quadrados. Calculamos cada parte e somamos.',f:'Área total = área 1 + área 2 + ...',q:'Uma base é formada por dois retângulos, de áreas 24 m² e 15 m². Qual é a área total?',o:['9 m²','31 m²','39 m²','360 m²'],a:2,e:'24 + 15 = 39 m².'},
{t:'Desafio de áreas decompostas',c:'Resolução de problemas',h:'EF08MA19',ae:'AE9',learn:'Planeje: identifique as formas, registre as medidas, calcule separadamente e confira a unidade.',f:'Estratégia: decompor → calcular → somar',q:'Um piso de 50 m² possui uma área vazada de 8 m². Quanto será revestido?',o:['42 m²','48 m²','58 m²','400 m²'],a:0,e:'50 − 8 = 42 m².'},
{t:'Revisão de figuras planas',c:'Revisão por decomposição',h:'EF08MA19',ae:'AE9',learn:'Na revisão, escolha a fórmula conforme a figura e diferencie unidade linear (m) de unidade de área (m²).',f:'Quadrado: A = l² | Retângulo: A = b × h',q:'Um quadrado tem lado 7 m. Qual é a área?',o:['14 m²','28 m²','49 m²','343 m²'],a:2,e:'7² = 49 m².'},
{t:'O número π',c:'π e comprimento da circunferência',h:'EF07MA33',ae:'AE9',learn:'π representa a razão entre o comprimento de uma circunferência e seu diâmetro. Usaremos π ≈ 3,14.',f:'C = πd = 2πr',q:'Uma zona circular tem diâmetro 10 m. Usando π = 3,14, qual é o comprimento?',o:['15,7 m','31,4 m','62,8 m','314 m'],a:1,e:'C = 3,14 × 10 = 31,4 m.'},
{t:'Círculos e setores circulares',c:'Área, comprimento e setor',h:'EF09MA11',ae:'AE9',learn:'A área do círculo depende do quadrado do raio. Um setor é uma fração do círculo determinada pelo ângulo central.',f:'A = πr² | Asetor = (ângulo/360°) × πr²',q:'Qual é a área de um círculo de raio 3 m, usando π = 3,14?',o:['9,42 m²','18,84 m²','28,26 m²','56,52 m²'],a:2,e:'A = 3,14 × 3² = 28,26 m².'},
{t:'Problemas com círculos',c:'Área e perímetro circular',h:'EF09MA11',ae:'AE9',learn:'Leia o enunciado para decidir: contorno pede comprimento; superfície pede área.',f:'Contorno → C = 2πr | Superfície → A = πr²',q:'Uma plataforma circular tem raio 5 m. Qual é seu comprimento, com π = 3,14?',o:['15,7 m','31,4 m','78,5 m','157 m'],a:1,e:'C = 2 × 3,14 × 5 = 31,4 m.'},
{t:'Verificação de áreas e perímetros',c:'Verificação da aprendizagem',h:'EF08MA19',ae:'AE9',learn:'Combine estratégias de decomposição e fórmulas, sempre conferindo as unidades.',f:'Área: unidade² | Perímetro: unidade',q:'Um terreno 9 m × 4 m precisa de cerca. Quantos metros de cerca são necessários?',o:['13 m','26 m','36 m','72 m'],a:1,e:'P = 2(9 + 4) = 26 m.'},
{t:'Revisão do círculo e setor',c:'Revisão circular',h:'EF07MA33',ae:'AE9',learn:'Um semicírculo corresponde à metade do círculo. Logo, sua área é πr² ÷ 2.',f:'Asemicírculo = πr² ÷ 2',q:'Qual é a área de um semicírculo de raio 4 m, usando π = 3,14?',o:['12,56 m²','25,12 m²','50,24 m²','100,48 m²'],a:1,e:'(3,14 × 16) ÷ 2 = 25,12 m².'},
{t:'Sorte ou azar?',c:'Probabilidade experimental',h:'EF07MA34',ae:'AE10',learn:'Na probabilidade experimental, usamos os resultados observados em tentativas reais ou simuladas.',f:'P experimental = ocorrências ÷ tentativas',q:'Em 20 partidas, um item apareceu 5 vezes. Qual foi a frequência relativa?',o:['5%','20%','25%','40%'],a:2,e:'5 ÷ 20 = 0,25 = 25%.'},
{t:'Conceito de probabilidade',c:'Resultados favoráveis e possíveis',h:'EF06MA30',ae:'AE10',learn:'Probabilidade é a razão entre resultados favoráveis e todos os resultados possíveis, quando são equiprováveis.',f:'P(E) = favoráveis ÷ possíveis',q:'Ao lançar um dado, qual é a probabilidade de sair 6?',o:['1/2','1/3','1/6','5/6'],a:2,e:'Há 1 resultado favorável entre 6 possíveis.'},
{t:'Espaços equiprováveis',c:'Cálculo de probabilidade',h:'EF09MA20',ae:'AE10',learn:'Em um espaço equiprovável, todos os resultados têm a mesma chance. A soma das probabilidades é 1.',f:'0 ≤ P(E) ≤ 1',q:'Em uma roleta com 8 setores iguais, 2 são dourados. Qual é P(dourado)?',o:['1/8','1/4','1/2','3/4'],a:1,e:'2/8 simplifica para 1/4.'},
{t:'Problemas de probabilidade',c:'Noções elementares',h:'EF09MA20',ae:'AE10',learn:'Liste o espaço amostral antes de contar os resultados favoráveis.',f:'Espaço amostral → evento → razão',q:'Em cartões numerados de 1 a 10, qual é a probabilidade de tirar número par?',o:['1/10','2/10','4/10','5/10'],a:3,e:'Pares: 2, 4, 6, 8 e 10. São 5 em 10.'},
{t:'Revisão equiprovável',c:'Revisão de probabilidade',h:'EF09MA20',ae:'AE10',learn:'Um evento impossível tem probabilidade 0; um evento certo tem probabilidade 1.',f:'Impossível = 0 | Certo = 1',q:'Qual é a probabilidade de obter um número menor que 7 em um dado comum?',o:['0','1/6','5/6','1'],a:3,e:'Todos os resultados 1 a 6 são menores que 7, então o evento é certo.'},
{t:'Construção do espaço amostral',c:'Espaços não equiprováveis',h:'EF08MA22',ae:'AE10',learn:'Construir o espaço amostral ajuda a perceber repetições e resultados com chances diferentes.',f:'Duas moedas: {CC, CK, KC, KK}',q:'Ao lançar duas moedas, qual é a probabilidade de sair exatamente uma cara?',o:['1/4','1/2','3/4','1'],a:1,e:'Os casos favoráveis são cara-coroa e coroa-cara: 2/4 = 1/2.'},
{t:'Eventos dependentes e independentes',c:'Relação entre eventos',h:'EF09MA20',ae:'AE10',learn:'Eventos independentes não alteram a chance um do outro. Sem reposição, o primeiro resultado pode mudar o segundo.',f:'Independentes: P(A e B) = P(A) × P(B)',q:'Lançar uma moeda e um dado são eventos...',o:['impossíveis','dependentes','independentes','certos'],a:2,e:'O resultado da moeda não altera o resultado do dado.'},
{t:'Batalha final da probabilidade',c:'Estratégias diversas',h:'EF09MA20',ae:'AE10',learn:'Na missão final, combine espaço amostral, independência e multiplicação de probabilidades.',f:'P(A e B) = P(A) × P(B)',q:'Qual é a probabilidade de sair cara em uma moeda e 6 em um dado?',o:['1/2','1/6','1/8','1/12'],a:3,e:'1/2 × 1/6 = 1/12.'}
];
let state=JSON.parse(localStorage.getItem('furiajapaState')||'{"done":[],"xp":0,"current":0}');
let timer=900,clock=null,selected=null;
function save(){localStorage.setItem('furiajapaState',JSON.stringify(state))}
function renderList(){const el=document.getElementById('missionList');el.innerHTML='';missions.forEach((m,i)=>{const b=document.createElement('button');const locked=i>0&&!state.done.includes(i-1)&&!state.done.includes(i);b.className='mission-btn '+(i===state.current?'active ':'')+(state.done.includes(i)?'done ':'')+(locked?'locked':'');b.innerHTML=`<span class="n">${state.done.includes(i)?'✓':i+1}</span><span><b>${m.t}</b><small>${m.c}</small></span><span>${locked?'🔒':'›'}</span>`;b.onclick=()=>{if(!locked){state.current=i;save();render()}};el.appendChild(b)})}
function render(){clearInterval(clock);clock=null;timer=900;selected=null;renderList();updateStats();if(state.done.length===18){renderVictory();return}const m=missions[state.current];document.getElementById('content').innerHTML=`<div class="hero"><div><span class="tag">Missão ${state.current+1} • ${m.ae} • ${m.h}</span><h2>${m.t}</h2><p>${m.c}</p></div><div class="timerbox"><label>BLOCO DE FOCO</label><div class="timer" id="timer">15:00</div><div class="timer-controls"><button onclick="startTimer()">▶</button><button onclick="pauseTimer()">Ⅱ</button><button onclick="resetTimer()">↻</button></div></div></div><div class="briefing"><b>Briefing da missão:</b> leia a explicação, analise a fórmula e resolva o desafio. Cada missão foi planejada para até 15 minutos.</div><div class="learn"><div class="card"><h3>📘 Aprenda</h3><div>${m.learn}</div></div><div class="card"><h3>⚡ Recurso tático</h3><div class="formula">${m.f}</div></div></div><div class="question"><h3>🎯 Desafio</h3><p>${m.q}</p><div class="options">${m.o.map((x,i)=>`<button class="opt" id="opt${i}" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${x}</button>`).join('')}</div><div class="actions"><button class="primary" onclick="check()">Confirmar resposta</button><button class="secondary" onclick="hint()">Pedir pista</button></div><div class="feedback" id="feedback"></div></div><div class="reward">🏆 Recompensa: <span>100 XP</span> pela primeira conclusão</div>`}
function pick(i){selected=i;document.querySelectorAll('.opt').forEach(x=>x.classList.remove('selected'));document.getElementById('opt'+i).classList.add('selected')}
function check(){const m=missions[state.current],f=document.getElementById('feedback');if(selected===null){f.className='feedback bad';f.textContent='Escolha uma alternativa antes de confirmar.';return}document.querySelectorAll('.opt').forEach(x=>x.disabled=true);document.getElementById('opt'+m.a).classList.add('correct');if(selected===m.a){f.className='feedback good';f.innerHTML='✅ Missão cumprida! '+m.e;if(!state.done.includes(state.current)){state.done.push(state.current);state.xp+=100}save();updateStats();setTimeout(()=>{if(state.done.length<18){state.current=Math.min(state.current+1,17);save();render()}else render()},1300)}else{document.getElementById('opt'+selected).classList.add('wrong');f.className='feedback bad';f.innerHTML='❌ Quase! '+m.e+' <button class="secondary" onclick="render()" style="margin-left:8px">Tentar novamente</button>'}}
function hint(){document.getElementById('feedback').className='feedback';document.getElementById('feedback').textContent='💡 Pista: identifique os dados, escolha a relação matemática e confira a unidade ou o total de resultados possíveis.'}
function updateStats(){document.getElementById('xp').textContent=state.xp;document.getElementById('level').textContent=Math.floor(state.xp/300)+1;document.getElementById('done').textContent=state.done.length+'/18';document.getElementById('progress').style.width=(state.done.length/18*100)+'%'}
function startTimer(){if(clock)return;clock=setInterval(()=>{if(timer>0){timer--;showTimer()}else{clearInterval(clock);clock=null;document.getElementById('feedback').textContent='⏱️ O bloco terminou. Finalize o desafio ou reinicie o cronômetro.'}},1000)}function pauseTimer(){clearInterval(clock);clock=null}function resetTimer(){pauseTimer();timer=900;showTimer()}function showTimer(){const e=document.getElementById('timer');if(e)e.textContent=String(Math.floor(timer/60)).padStart(2,'0')+':'+String(timer%60).padStart(2,'0')}
function resetGame(){if(confirm('Apagar todo o progresso de FúriaJapa?')){state={done:[],xp:0,current:0};save();render()}}
function renderVictory(){renderList();updateStats();document.getElementById('content').innerHTML=`<div class="victory"><div class="cup">🏆</div><span class="tag">Vitória Matemática</span><h2>FúriaJapa concluiu a campanha!</h2><p>As 18 missões foram finalizadas. Área, perímetro, círculo e probabilidade dominados.</p><div class="formula">XP TOTAL: ${state.xp} • NÍVEL ${Math.floor(state.xp/300)+1}</div><div class="actions" style="justify-content:center"><button class="primary" onclick="resetGame()">Jogar novamente</button></div></div>`}
render();
</script>
</body>
</html>
